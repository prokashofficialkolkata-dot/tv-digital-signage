<!DOCTYPE html>
<html>
<head>

<title>Hameeds TV Digital Signage</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
}

#slide {
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

</style>

</head>

<body>

<img id="slide" src="images/page01.jpg">


<script>

let pages = [

"page01.jpg",
"page02.jpg",
"page03.jpg",
"page04.jpg",
"page05.jpg",
"page06.jpg",
"page07.jpg",
"page08.jpg",
"page09.jpg",
"page10.jpg",
"page11.jpg",
"page12.jpg",
"page13.jpg",
"page14.jpg",
"page15.jpg",
"page16.jpg",
"page17.jpg",
"page18.jpg"

];


let current = 0;

let img = document.getElementById("slide");


function changeSlide(){

    current++;

    if(current >= pages.length){
        current = 0;
    }

    img.src = "images/" + pages[current];

}


// প্রতি 10 সেকেন্ড পর ছবি পরিবর্তন হবে
setInterval(changeSlide,10000);


</script>


</body>
</html>
