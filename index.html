<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hameeds TV Digital Signage</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
}


#slideshow{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}


#slideImage{

    width:100%;
    height:100%;

    object-fit:cover;

    opacity:1;

    transition:opacity 1.5s ease-in-out;

}


.fade{
    opacity:0;
}


</style>

</head>


<body>


<div id="slideshow">

<img id="slideImage" src="" alt="Food">

</div>



<script>


const OWNER = "prokashofficialkolkata-dot";

const REPO = "tv-digital-signage";

const FOLDER = "images";


let images=[];

let current=0;



async function loadImages(){


    const api =
    `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}`;


    const response = await fetch(api);


    const data = await response.json();


    images = data
    .filter(file=>file.type==="file")
    .map(file=>file.download_url);



    if(images.length>0){

        showImage();

    }

}



function showImage(){


    const img =
    document.getElementById("slideImage");


    img.classList.add("fade");


    setTimeout(()=>{


        img.src = images[current];


        img.onload=()=>{

            img.classList.remove("fade");

        };


        current++;


        if(current>=images.length){

            current=0;

        }


    },1500);


}




setInterval(()=>{

    if(images.length>0){

        showImage();

    }

},7000);



loadImages();



</script>


</body>

</html>
