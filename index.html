<!DOCTYPE html>
<html>
<head>

<title>Hameeds TV Digital Signage</title>

<style>

html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
}


.layer {

    position:absolute;
    width:100%;
    height:100%;
    object-fit:contain;

    opacity:0;

    transition: opacity 3s ease-in-out;

}


.show {

    opacity:1;

}

</style>

</head>


<body>


<img id="image1" class="layer">
<img id="image2" class="layer">


<script>


const OWNER = "prokashofficialkolkata-dot";
const REPO = "tv-digital-signage";
const FOLDER = "images";


let pictures = [];

let current = 0;

let active = 0;


let img1 = document.getElementById("image1");
let img2 = document.getElementById("image2");



async function loadPictures(){


const url =
`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}`;


const response = await fetch(url);

const files = await response.json();


pictures = files
.filter(file =>
file.name.toLowerCase().endsWith(".jpg") ||
file.name.toLowerCase().endsWith(".jpeg") ||
file.name.toLowerCase().endsWith(".png")
)
.map(file => file.download_url);



showNext();


}



function showNext(){


if(pictures.length === 0) return;


let nextImage = pictures[current];


if(active === 0){

    img2.src = nextImage;

    img2.classList.add("show");

    img1.classList.remove("show");

    active = 1;


}else{


    img1.src = nextImage;

    img1.classList.add("show");

    img2.classList.remove("show");

    active = 0;

}


current++;


if(current >= pictures.length){

current = 0;

}


}



loadPictures();


setInterval(showNext,20000);


</script>


</body>
</html>
