<!DOCTYPE html>
<html>
<head>

<title>Hameeds TV Digital Signage</title>

<style>
.clock-box{
    position:fixed;
    bottom:25px;
    right:25px;

    background:rgba(0,0,0,0.65);
    color:white;

    padding:12px 22px;

    border-radius:15px;

    font-family:Arial, sans-serif;

    text-align:center;

    box-shadow:0 0 15px rgba(255,255,255,0.25);

    backdrop-filter:blur(8px);

    z-index:10;
}


#time{
    font-size:32px;
    font-weight:bold;
}


#date{
    font-size:18px;
    margin-top:5px;
}

#day{
    font-size:20px;
    font-weight:bold;
}
    
html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
}


.layer {

    position:absolute;
    width:100%;
    height:100%;
    object-fit:contain;

    opacity:0;

    transition: opacity 3s ease-in-out;

}


.show {

    opacity:1;

}

</style>

</head>


<body>


<img id="image1" class="layer">
<img id="image2" class="layer">
<div class="clock-box">

<div id="time"></div>

<div id="day"></div>

<div id="date"></div>

</div>

<script>
function updateClock(){

let now = new Date();


let time = now.toLocaleTimeString("en-MY",{
hour:"2-digit",
minute:"2-digit",
second:"2-digit",
hour12:false
});


let day = now.toLocaleDateString("en-MY",{
weekday:"long"
});


let date = now.toLocaleDateString("en-MY",{
day:"2-digit",
month:"long",
year:"numeric"
});


document.getElementById("time").innerHTML=time;

document.getElementById("day").innerHTML=day;

document.getElementById("date").innerHTML=date;


}


setInterval(updateClock,1000);

updateClock();

const OWNER = "prokashofficialkolkata-dot";
const REPO = "tv-digital-signage";
const FOLDER = "images";


let pictures = [];

let current = 0;

let active = 0;


let img1 = document.getElementById("image1");
let img2 = document.getElementById("image2");



async function loadPictures(){


const url =
`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}`;


const response = await fetch(url);

const files = await response.json();


pictures = files
.filter(file =>
file.name.toLowerCase().endsWith(".jpg") ||
file.name.toLowerCase().endsWith(".jpeg") ||
file.name.toLowerCase().endsWith(".png")
)
.map(file => file.download_url);



showNext();


}



function showNext(){


if(pictures.length === 0) return;


let nextImage = pictures[current];


if(active === 0){

    img2.src = nextImage;

    img2.classList.add("show");

    img1.classList.remove("show");

    active = 1;


}else{


    img1.src = nextImage;

    img1.classList.add("show");

    img2.classList.remove("show");

    active = 0;

}


current++;


if(current >= pictures.length){

current = 0;

}


}



loadPictures();


setInterval(showNext,20000);


</script>


</body>
</html>
