<!DOCTYPE html>
<html>
<head>
<title>Hameeds TV Digital Signage</title>

<style>
html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
}

#slide {
    width:100%;
    height:100%;
    object-fit:contain;
    transition:opacity 1.5s;
}
</style>

</head>

<body>

<img id="slide">

<script>

const OWNER = "prokashofficialkolkata-dot";
const REPO = "tv-digital-signage";
const FOLDER = "images";

let pictures = [];
let current = 0;

const img = document.getElementById("slide");


async function loadPictures(){

    const url =
    `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}`;

    const response = await fetch(url);

    const files = await response.json();


    pictures = files
    .filter(file =>
        file.name.toLowerCase().endsWith(".jpg") ||
        file.name.toLowerCase().endsWith(".jpeg") ||
        file.name.toLowerCase().endsWith(".png")
    )
    .map(file => file.download_url);


    showSlide();

}



function showSlide(){

    if(pictures.length === 0){
        return;
    }


    img.style.opacity = 0;


    setTimeout(()=>{

        img.src = pictures[current];

        img.onload = ()=>{
            img.style.opacity = 1;
        };


        current++;


        if(current >= pictures.length){
            current = 0;
        }


    },1500);

}



setInterval(showSlide,7000);


loadPictures();


</script>

</body>
</html>
